# Pipeline settings. Paths are relative to the repository root.
# Environment variables override two keys: TARGET_COUNT (search.target_count)
# and MIN_MATCHES (min_matches).

# Keyword filter, shared by search and prevalence
min_matches: 2               # minimum number of DISTINCT keywords per kept post
keywords_file: config/keywords.txt

search:                      # python -m collection.search
  target_count: 10000        # stop once posts.jsonl holds this many posts
  output_dir: data/raw       # posts.jsonl goes here (test runs: data/raw/test/)
  progress_every: 100        # print progress every N kept posts
  host: https://bsky.social
  queries_file: config/search_queries.txt
  page_limit: 100            # results per request (API max 100)
  max_pages: 0               # pages per query; 0 = paginate fully
  sort: latest               # latest | top
  delay_s: 1                 # pause between requests
  max_retries: 5             # retries on 429 / 5xx
  # Labelers whose labels the AppView should apply (atproto-accept-labelers header).
  # Bluesky's moderation service is applied by default anyway; sending it makes this explicit.
  accept_labelers: did:plc:ar7c4by46qjdydhdevvrndac

prevalence:                  # python -m collection.prevalence (counts only, no text or identifiers)
  hours: 24
  output: data/prevalence/prevalence.json
  save_interval_s: 60        # how often the counts and cursor are written to disk
  heartbeat_s: 60            # how often a status line is printed
  # Jetstream v2 (recommended by https://bsky.network/docs/jetstream). v1 also works:
  # wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post
  jetstream_url: wss://jetstream.us-east.bsky.network/xrpc/network.bsky.jetstream.subscribeEvents?collections=app.bsky.feed.post
  backoff_initial_s: 1       # reconnect delay, doubling up to backoff_max_s
  backoff_max_s: 60
  # Replay mode (--since/--until): reads Jetstream's archive; needs JETSTREAM_API_KEY in .env
  replay_host: https://jetstream.us-east.bsky.network
  replay_output: data/prevalence/prevalence_7d.json
  gap_threshold_s: 300       # report gaps between events longer than this

clean:                       # python -m collection.clean
  input: data/raw/posts.jsonl
  output: data/raw/posts_clean.jsonl
  max_per_account: 5         # cap posts per account (random pick)
  seed: 42                   # fixed seed so the cap is reproducible
